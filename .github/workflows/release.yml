name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      BROAGENTAI_SIGN_COMMAND: ${{ secrets.BROAGENTAI_SIGN_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package host release bundle
        run: npm run release -- --skip-build
      - name: Optional signing / notarization hook (disabled unless secret is set)
        if: ${{ env.BROAGENTAI_SIGN_COMMAND != '' }}
        shell: bash
        env:
          RELEASE_DIR: release
        run: bash -c "$BROAGENTAI_SIGN_COMMAND"
      - name: Stage release payload
        shell: bash
        run: |
          mkdir -p payload
          cp release/* payload/
      - uses: actions/upload-artifact@v4
        with:
          name: broagentai-${{ matrix.os }}
          path: payload/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: broagentai-*
          path: artifacts
          merge-multiple: false
      - name: Combine checksums
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f ! -name 'SHA256SUMS.txt' -exec cp {} dist/ \;
          cat artifacts/*/SHA256SUMS.txt | LC_ALL=C sort -k2 | awk '!seen[$2]++' > dist/SHA256SUMS.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
