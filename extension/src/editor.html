<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - BrowserAgent</title>
  <link rel="stylesheet" href="./sidepanel.css" />
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: var(--bg, #1e1e1e); color: var(--fg, #d4d4d4); font-family: system-ui, sans-serif; }
    .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border, #333); background: var(--header-bg, #252526); }
    .editor-header .file-info { display: flex; flex-direction: column; }
    .editor-header .file-name { font-weight: 600; font-size: 14px; }
    .editor-header .file-meta { font-size: 12px; color: var(--muted, #888); }
    .editor-actions { display: flex; gap: 8px; }
    .editor-container { flex: 1; overflow: hidden; position: relative; }
    #editor { width: 100%; height: 100%; }
    .status-bar { padding: 4px 12px; border-top: 1px solid var(--border, #333); background: var(--header-bg, #252526); font-size: 12px; display: flex; justify-content: space-between; }
    .btn { padding: 4px 12px; border: 1px solid var(--border, #333); background: var(--btn-bg, #333); color: var(--fg, #d4d4d4); border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn:hover { background: var(--btn-hover, #444); }
    .btn.primary { background: var(--accent, #007acc); border-color: var(--accent, #007acc); color: white; }
    .btn.primary:hover { background: var(--accent-hover, #0062a3); }
    .btn.danger { background: var(--danger, #f14c4c); border-color: var(--danger, #f14c4c); color: white; }
  </style>
</head>
<body>
  <div class="editor-header">
    <div class="file-info">
      <span class="file-name" id="fileName">Untitled</span>
      <span class="file-meta" id="fileMeta">Menunggu file...</span>
    </div>
    <div class="editor-actions">
      <button class="btn" id="btnBack">&larr; Kembali</button>
      <button class="btn primary" id="btnSave">Simpan</button>
    </div>
  </div>
  <div class="editor-container">
    <div id="editor"></div>
  </div>
  <div class="status-bar">
    <span id="statusMsg">Siap</span>
    <span id="cursorPos">Ln 1, Col 1</span>
  </div>
  <script type="module" src="./editor.ts"></script>
</body>
</html>
