<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - BroAgentAI</title>
  <link rel="stylesheet" href="./sidepanel.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-editor); color: var(--text); }
    .editor-header { height: 35px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 0 12px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
    .editor-header .file-info { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .editor-header .file-name { font-size: 13px; color: var(--text-strong); white-space: nowrap; }
    .editor-header .file-meta { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .editor-actions { display: flex; gap: 8px; flex: none; }
    .editor-container { flex: 1; overflow: hidden; position: relative; }
    #editor { width: 100%; height: 100%; }
    .status-bar { height: 22px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: var(--accent); color: #ffffff; font-size: 12px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .btn.primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="editor-header">
    <div class="file-info">
      <span class="file-name" id="fileName">Untitled</span>
      <span class="file-meta" id="fileMeta">Menunggu file...</span>
    </div>
    <div class="editor-actions">
      <button class="btn" id="btnBack">&larr; Kembali</button>
      <button class="btn primary" id="btnSave">Simpan</button>
    </div>
  </div>
  <div class="editor-container">
    <div id="editor"></div>
  </div>
  <div class="status-bar">
    <span id="statusMsg">Siap</span>
    <span id="cursorPos">Ln 1, Col 1</span>
  </div>
  <script type="module" src="./editor.ts"></script>
</body>
</html>
