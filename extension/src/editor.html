<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - BroAgentAI</title>
  <link rel="stylesheet" href="./sidepanel.css" />
</head>
<body class="editor-page">
  <div class="editor-header">
    <div class="file-info">
      <span class="file-name" id="fileName">Untitled</span>
      <span class="file-meta" id="fileMeta">Menunggu file...</span>
    </div>
    <div class="editor-actions">
      <button id="btnBack">&larr; Kembali</button>
      <button class="primary" id="btnSave">Simpan</button>
    </div>
  </div>
  <div class="editor-container">
    <div id="editor"></div>
  </div>
  <div class="status-bar">
    <span id="statusMsg">Siap</span>
    <span id="cursorPos">Ln 1, Col 1</span>
  </div>
  <script type="module" src="./editor.ts"></script>
</body>
</html>
